<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katkafi Links</title>
<meta name="description" content="Katkafi: cat café and adoption center in Greater Tunis. Our pitch and our 3D café.">
<link rel="icon" href="katkafi-logo.png">
<meta property="og:title" content="Katkafi">
<meta property="og:description" content="Rescue · Care · Coffee · Match">
<meta property="og:image" content="katkafi-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1814; --bg2: #16241e; --ivory: #f2ead8; --brass: #c9a86a;
    --pink: #d97bc4; --muted: #a9a394; --card: rgba(242,234,216,.06); --line: rgba(201,168,106,.35);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(120% 70% at 50% 0%, #1f3a30 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--ivory); font-family: Inter, system-ui, sans-serif;
    display: flex; justify-content: center; padding: 56px 16px 40px;
  }
  main { width: 100%; max-width: 440px; text-align: center; }
  .logo-wrap { position: relative; width: 150px; margin: 0 auto 18px; }
  .logo-wrap::before { /* soft pink halo, a nod to the logo's colour */
    content: ""; position: absolute; inset: 12% 8%; border-radius: 50%;
    background: var(--pink); filter: blur(34px); opacity: .32;
  }
  .logo { position: relative; width: 100%; display: block; animation: bob 5s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-5px) rotate(-1.5deg); } }
  h1 { font-family: Fraunces, Georgia, serif; font-weight: 600; font-size: 44px; letter-spacing: .5px; }
  .tag { margin-top: 6px; color: var(--brass); font-size: 12px; letter-spacing: 3px; text-transform: uppercase; }
  .sub { margin-top: 10px; color: var(--muted); font-size: 14px; }
  .links { margin-top: 34px; display: grid; gap: 14px; }
  a.link {
    display: flex; align-items: center; gap: 14px; text-align: left; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 12px 16px 12px 12px;
    transition: transform .2s, background .2s, border-color .2s;
  }
  a.link:hover, a.link:focus-visible { transform: translateY(-2px); background: rgba(242,234,216,.1); border-color: var(--brass); outline: none; }
  .thumb { flex: none; width: 76px; height: 54px; border-radius: 10px; overflow: hidden; background: var(--bg2);
    display: grid; place-items: center; border: 1px solid rgba(242,234,216,.12); }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb svg { width: 28px; height: 28px; color: var(--brass); }
  .txt { flex: 1; min-width: 0; }
  .txt b { display: block; font-family: Fraunces, Georgia, serif; font-weight: 500; font-size: 19px; }
  .txt span { display: block; margin-top: 2px; color: var(--muted); font-size: 13px; }
  .arrow { flex: none; color: var(--brass); font-size: 18px; }
  .dl { display: inline-block; margin-top: 8px; color: var(--muted); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
  .dl:hover { color: var(--ivory); }
  footer { margin-top: 44px; color: var(--muted); font-size: 12px; }
  footer i { font-family: Fraunces, Georgia, serif; color: var(--ivory); }
  @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="logo-wrap"><img class="logo" src="katkafi-logo.png" alt="Katkafi logo: a smiling halftone cat"></div>
  <h1>katkafi</h1>
  <p class="tag">Rescue · Care · Coffee · Match</p>
  <p class="sub">Cat café &amp; adoption center · Greater Tunis</p>

  <nav class="links">
    <a class="link" href="../">
      <span class="thumb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h13v4a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5z"/><path d="M17 11h1.5a2.5 2.5 0 0 1 0 5H17"/><path d="M8 3c-.6 1 .6 2 0 3M12 3c-.6 1 .6 2 0 3"/></svg></span>
      <span class="txt"><b>Step inside the café</b><span>Our 3D café: meet the cats, turn on the radio</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="link" href="../story/">
      <span class="thumb"><img src="pitch-cover.jpg" alt=""></span>
      <span class="txt"><b>Our pitch</b><span>The Katkafi plan, as an interactive zine</span></span>
      <span class="arrow">→</span>
    </a>
  </nav>

  <footer>Every coffee gives a street cat <i>a second chance.</i></footer>
</main>
</body>
</html>
