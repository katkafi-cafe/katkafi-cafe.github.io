<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Katkafi Cat Café</title>
<meta name="description" content="Concept demo: an explorable 3D cat café for Katkafi, with rescue, care, coffee and matchmaking.">
<link rel="icon" href="katkafi-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1814;        /* midnight emerald */
    --cream: #f2ead8;     /* ivory */
    --tan: #c9a86a;       /* antique brass */
    --blue: #1f4a3c;      /* bottle green */
    --terra: #6e1f2b;     /* oxblood */
    --ink: #141a17;
    --panel: #f4eee2;
    --line: #e2d8c4;
    --muted: #6d675c;
  }
  /* The café is a moody evening scene, so dark mode keeps the same palette. */
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0f1814; --cream: #f2ead8; --panel: #f4eee2; --ink: #141a17; }
  }
  :root[data-theme="dark"] { --bg: #0f1814; --cream: #f2ead8; --panel: #f4eee2; --ink: #141a17; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--cream); font-family: "DM Sans", system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  button { font: inherit; }

  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  body.dragging #scene { cursor: grabbing; }

  /* ---------- UI chrome ---------- */
  .ui { transition: opacity .5s ease; }
  body:not(.entered) .ui, body:not(.entered) #hotspots { opacity: 0; pointer-events: none; }
  .top { position: fixed; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; align-items: center; padding: 16px 24px; pointer-events: none; z-index: 3; }
  .top > * { pointer-events: auto; }
  .logo { display: flex; align-items: center; gap: 10px; font-family: Fraunces, serif; font-weight: 600; font-size: 26px; letter-spacing: -.01em; text-shadow: 0 2px 10px rgba(0,0,0,.35); }
  .logo img { width: 46px; height: 42px; object-fit: contain; filter: drop-shadow(0 2px 6px rgba(0,0,0,.4)); }
  .join { background: var(--blue); color: var(--cream); border: 1px solid var(--tan); border-radius: 999px; padding: 11px 20px; font-weight: 600; font-size: 14px; cursor: pointer; box-shadow: 0 3px 0 #0f2a21; transition: transform .15s, box-shadow .15s; }
  .join:hover { transform: translateY(-1px); box-shadow: 0 4px 0 #0f2a21; }
  .join:active { transform: translateY(2px); box-shadow: 0 1px 0 #0f2a21; }

  .spots-nav, .hint { background: rgba(15,24,20,.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border-radius: 14px; padding: 10px 14px; }
  .spots-nav { position: fixed; left: 24px; bottom: 24px; display: flex; flex-direction: column; gap: 4px; z-index: 3; }
  .spots-nav button { background: none; border: 0; color: var(--cream); font-size: 14px; text-align: left; opacity: .8; cursor: pointer; padding: 3px 0; transition: opacity .2s, transform .2s; }
  .spots-nav button:hover, .spots-nav button:focus-visible { opacity: 1; transform: translateX(4px); }
  .spots-nav button b { font-weight: 700; font-size: 11px; color: var(--tan); margin-right: 10px; }
  .hint { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; text-align: center; line-height: 1.8; pointer-events: none; z-index: 3; }
  body.focused .spots-nav, body.focused .hint, body.focused #hotspots { opacity: 0; pointer-events: none; }

  /* ---------- Hotspots ---------- */
  #hotspots { position: fixed; inset: 0; pointer-events: none; transition: opacity .4s; z-index: 2; }
  .hotspot { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--cream); pointer-events: auto; will-change: transform; }
  .hotspot[hidden] { display: none; }
  .dot { width: 18px; height: 18px; border-radius: 50%; background: var(--blue); border: 3px solid var(--tan); position: relative; flex: none; box-shadow: 0 2px 8px rgba(0,0,0,.3); }
  .dot::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid var(--tan); animation: pulse 2s ease-out infinite; }
  .label { font-size: 12px; font-weight: 600; background: rgba(15,24,20,.85); padding: 6px 10px; border-radius: 999px; white-space: nowrap; opacity: 0; transform: translateX(-6px); transition: opacity .2s, transform .2s; }
  .hotspot:hover .label, .hotspot:focus-visible .label { opacity: 1; transform: none; }
  @media (hover: none) { .label { opacity: 1; transform: none; } }

  /* ---------- Speech bubbles ---------- */
  #bubbles { position: fixed; inset: 0; pointer-events: none; z-index: 1; transition: opacity .4s; }
  body:not(.entered) #bubbles { opacity: 0; }
  .bubble { position: absolute; left: 0; top: 0; background: var(--cream); color: var(--ink); font-size: 12px; font-weight: 600; padding: 7px 11px; border-radius: 12px; white-space: nowrap; opacity: 0; transition: opacity .3s; box-shadow: 0 4px 14px rgba(0,0,0,.25); margin-top: -8px; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-top-color: var(--cream); border-bottom: 0; }
  .bubble.show { opacity: 1; }
  .bubble.cat { background: var(--tan); }
  .bubble.cat::after { border-top-color: var(--tan); }

  /* ---------- Panel ---------- */
  #panel { position: fixed; top: 12px; right: 12px; bottom: 12px; width: min(430px, calc(100% - 24px)); background: var(--panel); color: var(--ink); border-radius: 22px; padding: 22px 28px 28px; overflow-y: auto; transform: translateX(calc(100% + 24px)); transition: transform .6s cubic-bezier(.2,.8,.2,1); box-shadow: 0 24px 70px rgba(0,0,0,.45); z-index: 4; }
  #panel.open { transform: none; }
  .back { background: var(--ink); color: var(--cream); border: 0; border-radius: 999px; padding: 9px 16px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .back:hover { background: var(--blue); }
  .kicker { font-size: 12px; font-weight: 700; color: #8a6d36; letter-spacing: .12em; text-transform: uppercase; margin: 28px 0 10px; }
  #panel h2 { font-family: Fraunces, serif; font-weight: 600; font-size: 38px; line-height: 1.05; margin: 0 0 14px; letter-spacing: -.015em; }
  #panel h2 em { color: var(--terra); font-weight: 500; }
  #panel p.body { line-height: 1.6; color: #3d3a33; font-size: 15px; margin: 0; }
  #panel ul { list-style: none; padding: 0; margin: 22px 0 24px; border-top: 1px solid var(--line); }
  #panel li { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  #panel li span:first-child { font-weight: 600; }
  #panel li span:last-child { color: var(--muted); text-align: right; }
  .cta { display: inline-block; background: var(--blue); color: #fff; text-decoration: none; font-weight: 600; font-size: 14px; padding: 12px 20px; border-radius: 999px; box-shadow: 0 3px 0 #0f2a21; }
  .cta:hover { filter: brightness(1.06); }
  .note { font-size: 12px; color: var(--muted); margin: 14px 0 0; }

  /* ---------- Gate ---------- */
  #gate { position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 16px; background: rgba(15,24,20,.92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: opacity 1s ease, visibility 1s; }
  body.entered #gate { opacity: 0; visibility: hidden; }
  .mascot { width: 170px; height: 154px; object-fit: contain; filter: drop-shadow(0 0 28px rgba(217,123,196,.35)); margin-bottom: 22px; animation: peek 3.2s ease-in-out infinite; }
  .welcome { font-family: Fraunces, serif; font-style: italic; font-size: clamp(24px, 4vw, 34px); margin: 0; opacity: .85; }
  #gate h1 { font-family: Fraunces, serif; font-weight: 700; font-size: clamp(64px, 12vw, 128px); line-height: .95; margin: 2px 0 12px; letter-spacing: -.03em; }
  .tagline { margin: 0; max-width: 420px; font-size: 16px; line-height: 1.5; color: var(--tan); }
  .loader { margin-top: 28px; height: 56px; }
  .bar { width: 180px; height: 6px; background: rgba(246,236,220,.18); border-radius: 3px; overflow: hidden; margin: 0 auto 12px; }
  .bar span { display: block; height: 100%; width: 0; background: var(--tan); transition: width .15s linear; }
  .loader p { font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; margin: 0; }
  .enter { font-size: 13px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; background: var(--cream); color: var(--ink); border: 0; border-radius: 999px; padding: 14px 28px; cursor: pointer; margin-top: 28px; box-shadow: 0 4px 0 var(--tan); transition: transform .15s; }
  .enter:hover, .enter:focus-visible { transform: translateY(-2px); }
  .enter[hidden], .loader[hidden] { display: none; }

  .demo-note { position: fixed; right: 16px; bottom: 12px; margin: 0; font-size: 11px; opacity: .55; z-index: 11; pointer-events: none; }
  body.focused .demo-note { opacity: 0; }

  /* ---------- Teaser lightbox ---------- */
  #teaser { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; background: rgba(8,12,10,.88); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); opacity: 0; visibility: hidden; transition: opacity .45s ease, visibility .45s; }
  #teaser.open { opacity: 1; visibility: visible; }
  .tz-card { position: relative; display: flex; flex-direction: column; align-items: center; gap: 14px; transform: scale(.96); transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  #teaser.open .tz-card { transform: none; }
  #teaser video { display: block; height: min(80vh, 760px); max-width: calc(100vw - 32px); aspect-ratio: 9 / 16; object-fit: cover; background: #000; border: 1px solid var(--tan); border-radius: 14px; box-shadow: 0 30px 90px rgba(0,0,0,.6); }
  .tz-title { margin: 0; font-family: Fraunces, serif; font-style: italic; font-size: 20px; color: var(--cream); }
  .tz-title b { font-style: normal; font-family: "DM Sans", sans-serif; font-size: 11px; letter-spacing: .2em; color: var(--tan); margin-right: 10px; vertical-align: 3px; }
  .tz-close { position: absolute; top: -6px; right: -54px; width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--tan); background: rgba(15,24,20,.7); color: var(--cream); font-size: 20px; line-height: 1; cursor: pointer; }
  .tz-close:hover, .tz-close:focus-visible { background: var(--blue); }
  @media (max-width: 820px) { .tz-close { right: 6px; top: 6px; z-index: 1; } #teaser video { height: min(74vh, 720px); } }
  .hotspot.teaser-spot .dot { background: var(--terra); }

  /* ---------- Katkafi radio ---------- */
  .radio { position: fixed; right: 16px; bottom: 34px; z-index: 3; width: 272px; padding: 10px; border-radius: 16px; background: rgba(15,24,20,.8); border: 1px solid rgba(201,168,106,.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); box-shadow: 0 12px 40px rgba(0,0,0,.35); }
  .radio .now { display: flex; align-items: center; gap: 10px; }
  .yt-wrap { flex: none; width: 96px; height: 54px; border-radius: 8px; overflow: hidden; background: #000; border: 1px solid rgba(201,168,106,.35); }
  .yt-wrap iframe { width: 96px; height: 54px; display: block; border: 0; }
  .radio .meta { flex: 1; min-width: 0; }
  .radio .meta small { display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .18em; color: var(--tan); }
  .radio .meta span { display: block; font-family: Fraunces, serif; font-style: italic; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .radio .meta em { display: block; font-style: normal; font-size: 11px; opacity: .7; margin-top: 1px; }
  .rbtn { flex: none; width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--tan); background: var(--blue); color: var(--cream); display: grid; place-items: center; cursor: pointer; padding: 0; }
  .rbtn:hover, .rbtn:focus-visible { background: #2a5f4e; }
  .rbtn svg { width: 14px; height: 14px; fill: currentColor; }
  .rbtn .pause, .rbtn.on .play { display: none; }
  .rbtn.on .pause { display: block; }
  .rbtn.small { width: 26px; height: 26px; background: none; border-color: rgba(201,168,106,.5); }
  .rbtn.small svg { width: 12px; height: 12px; }
  .rbtn.small.on { background: var(--blue); }
  .radio .row { display: flex; align-items: center; gap: 10px; margin-top: 9px; font-size: 11px; font-weight: 600; letter-spacing: .04em; }
  .radio .row label { width: 92px; flex: none; opacity: .85; }
  .radio input[type=range] { flex: 1; min-width: 0; accent-color: var(--tan); height: 4px; }
  .radio .fold { position: absolute; top: -10px; right: 12px; width: 22px; height: 22px; border-radius: 50%; border: 1px solid rgba(201,168,106,.5); background: var(--bg); color: var(--tan); font-size: 12px; line-height: 1; cursor: pointer; padding: 0; }
  .radio.min .row { display: none; }
  .radio.min .fold { transform: rotate(180deg); }
  body.focused .radio { opacity: 0; pointer-events: none; }
  @media (max-width: 820px) { .radio { right: 12px; bottom: 74px; width: 250px; } }

  @keyframes pulse { 0% { transform: scale(.8); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
  @keyframes peek { 0%, 100% { transform: rotate(-3deg) translateY(0); } 50% { transform: rotate(3deg) translateY(-6px); } }

  @media (max-width: 820px) {
    .top { padding: 12px 16px; }
    .logo { font-size: 21px; }
    .logo img { width: 38px; height: 34px; }
    .join { padding: 9px 14px; font-size: 13px; }
    .spots-nav { display: none; }
    .hint { bottom: 18px; width: calc(100% - 32px); }
    #panel { top: auto; left: 12px; right: 12px; width: auto; max-height: 62vh; transform: translateY(calc(100% + 24px)); padding: 18px 20px 24px; }
    #panel h2 { font-size: 31px; }
    .kicker { margin-top: 20px; }
    .demo-note { display: none; }
    .mascot { width: 136px; height: 124px; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
  }
</style>

<body>
  <canvas id="scene" aria-label="Explorable 3D cat café"></canvas>
  <div id="bubbles"></div>
  <div id="hotspots"></div>

  <header class="top ui">
    <div class="logo"><img src="katkafi-logo.png" alt="">katkafi</div>
    <button class="join" data-open="adopt">Adopt a cat</button>
  </header>

  <nav class="spots-nav ui" aria-label="Explore the café"></nav>
  <p class="hint ui">Drag or pinch to look · Tap a cat to say hi<br>Tap hotspots to explore</p>

  <aside id="panel" aria-hidden="true" aria-live="polite">
    <button class="back">← Back to the café</button>
    <div class="panel-body"></div>
  </aside>

  <section id="gate">
    <img class="mascot" src="katkafi-logo.png" alt="Katkafi logo: a smiling halftone cat">
    <p class="welcome">Welcome to</p>
    <h1>katkafi</h1>
    <p class="tagline">Rescue, care, coffee and matchmaking for cats, all under one roof in Tunis.</p>
    <div class="loader">
      <div class="bar"><span></span></div>
      <p>Waking the cats <b class="pct">0</b>%</p>
    </div>
    <button class="enter" hidden>Click to enter</button>
  </section>

  <section class="radio ui" aria-label="Katkafi radio">
    <button class="fold" aria-label="Show or hide the radio controls">▾</button>
    <div class="now">
      <div class="yt-wrap"><div id="yt-player"></div></div>
      <div class="meta"><small>KATKAFI RADIO</small><span>Cool Cat</span><em>Queen</em></div>
      <button class="rbtn music-btn" aria-label="Play the radio">
        <svg class="play" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>
        <svg class="pause" viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>
      </button>
    </div>
    <div class="row"><label for="music-vol">Music</label><input id="music-vol" type="range" min="0" max="100" value="45"></div>
    <div class="row">
      <label for="amb-vol">Street &amp; cats</label><input id="amb-vol" type="range" min="0" max="100" value="60">
      <button class="rbtn small amb-btn on" aria-label="Turn off the street and cat sounds">
        <svg class="play" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z"/></svg>
        <svg class="pause" viewBox="0 0 16 16"><path d="M3.5 2.5h3v11h-3zM9.5 2.5h3v11h-3z"/></svg>
      </button>
    </div>
  </section>

  <div id="teaser" role="dialog" aria-modal="true" aria-label="Katkafi teaser video" aria-hidden="true">
    <div class="tz-card">
      <video controls playsinline preload="none" poster="katkafi-teaser-poster.jpg" src="katkafi-teaser.mp4"></video>
      <p class="tz-title"><b>NOW SHOWING</b>A stray finds its place</p>
      <button class="tz-close" aria-label="Close the video">×</button>
    </div>
  </div>

  <p class="demo-note">Concept demo · sample content</p>

<script type="module">
import * as THREE from 'three';

/* ================= Content ================= */
const SPOTS = [
  { id: 'table', label: 'Café table', pos: [0, 1.05, -1], zoom: .45, fov: 46,
    kicker: '01 · Katkafi at a glance', title: 'Rescue, care, coffee and <em>matchmaking.</em>',
    body: 'A cat sanctuary, care center and coffee shop in Greater Tunis. Every coffee, grooming and playdate gives a street cat a second chance.',
    points: [['The heart', 'Rescue & adoption'], ['The service', 'Care'], ['The experience', 'Coffee'], ['The community', 'Match']],
    cta: ['Our story', '#'] },
  { id: 'bar', label: 'Coffee bar', pos: [2.1, 1.85, -4.4], dot: [2.1, 1.5, -4.4], zoom: .45, fov: 50,
    kicker: '02 · Kitty café', title: 'Coffee, pastries and <em>purrs.</em>',
    body: 'Drinks and snacks in a room shared with adoptable cats you can play with. Joy without commitment, any day of the week.',
    points: [['Espresso', '3.5 TND'], ['Cappuccino', '5 TND'], ['Latte', '5.5 TND'], ['Croissant', '3 TND'], ['Play session', '10 TND']],
    cta: ['Book a play session', '#'], note: 'Sample menu: prices are placeholders.' },
  { id: 'adopt', label: 'Adoption board', pos: [-4.85, 1.9, -2], zoom: .45, fov: 42,
    kicker: '03 · Rescue & adoption', title: 'Meet a cat you <em>already know.</em>',
    body: 'Street cats are vaccinated, neutered and socialized, then matched with vetted adopters. Meet, play and bond in the café before you adopt.',
    points: [['01 Rescue', 'Take in & treat'], ['02 Care', 'Vaccinate & neuter'], ['03 Socialize', 'Play in the café'], ['04 Home', 'Adopt with follow-up']],
    cta: ['See who is waiting', '#'] },
  { id: 'groom', label: 'Grooming', pos: [4.85, 1.7, -1.6], zoom: .45, fov: 44,
    kicker: '04 · Care services', title: 'One <em>trusted address</em> for your cat.',
    body: "Pet-sitting, grooming and health care, delivered with partner veterinarians, so your cat's routine and health live in one place.",
    points: [['Grooming', 'Bath, brush, nails'], ['Pet-sitting', 'While you are away'], ['Health care', 'Partner vets'], ['Follow-up', 'One health record']],
    cta: ['Book care', '#'] },
  { id: 'tree', label: 'Cat tree', pos: [-4.15, 1.3, .9], dot: [-4.15, 2.5, .9], zoom: .15, fov: 44,
    kicker: '05 · Cat matchmaking', title: 'New best friends, <em>safely introduced.</em>',
    body: 'Friend-finding for social cats, and supervised introductions for responsible breeding. No more risky social-media posts.',
    points: [['Playdates', 'For social cats'], ['Introductions', 'Supervised'], ['Breeding', 'Responsible only'], ['Pays through', 'Matching fee']],
    cta: ['Find a friend', '#'] },
  { id: 'booth', label: 'Visit & support', pos: [3.8, 1.3, 1.5], dot: [3.8, 2.3, 1.5], zoom: .4, fov: 52,
    kicker: '06 · Visit & support', title: 'Every visit helps a <em>street cat.</em>',
    body: 'Come for a coffee, sponsor a cat or give to the Rescue Fund. A fixed share of profit treats new strays, and we publish a public impact report.',
    points: [['Where', 'Greater Tunis'], ['Sponsor', 'A cat or the Rescue Fund'], ['Contact', 'hello@katkafi.tn']],
    cta: ['Sponsor a cat', '#'], note: 'Contact details are placeholders.' },
];

/* ================= Setup ================= */
const $ = s => document.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const canvas = $('#scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;

const scene = new THREE.Scene();
scene.background = new THREE.Color('#0f1814');
const camera = new THREE.PerspectiveCamera(72, 1, 0.05, 60);
camera.rotation.order = 'YXZ';

// royal palette: midnight emerald, oxblood, antique brass and ivory
const C = { espresso: '#1a1817', cream: '#f2ead8', tan: '#c9a86a', blue: '#1f4a3c', terra: '#6e1f2b',
  wall: '#e8dfcd', backWall: '#5e1d2a', wood: '#6e4a33', woodDark: '#2e211b', leaf: '#4f8a5a', leaf2: '#2f6544', steel: '#c9ccd1',
  brass: '#b8955a' };
const brassMat = (o = {}) => new THREE.MeshStandardMaterial({ color: '#c9a35e', metalness: .85, roughness: .32, ...o });

const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .78, metalness: 0, ...o });
function add(geo, m, x, y, z, parent = scene) {
  const mesh = new THREE.Mesh(geo, typeof m === 'string' ? mat(m) : m);
  mesh.position.set(x, y, z);
  mesh.castShadow = mesh.receiveShadow = true;
  parent.add(mesh);

  calico:  { base: '#fbf6ee', back: '#d98a3d', patch: '#2b2524', head: '#fbf6ee', headPatch: '#d98a3d', muzzle: '#fbf6ee', ears: '#d98a3d', tail: '#2b2524', eye: '#4f7d3a' },
};
const SPH = new THREE.SphereGeometry(1, 18, 12);
const EAR = new THREE.ConeGeometry(1, 1, 4);
const CUBE = new THREE.BoxGeometry(1, 1, 1);
const TAILSEG = new THREE.CylinderGeometry(.018, .021, .062, 8).translate(0, .031, 0);
const LEG = new THREE.CylinderGeometry(.022, .019, .19, 8).translate(0, -.095, 0);
const catMats = new Map();
const catMat = col => { if (!catMats.has(col)) catMats.set(col, new THREE.MeshStandardMaterial({ color: col, roughness: .92 })); return catMats.get(col); };

function makeCat({ coat = 'ginger', pose = 'sit', scale = 1, pos = [0, 0, 0], rotY = 0, watch = false, path = null }) {
  const c = CAT_COATS[coat];
  const root = new THREE.Group(); root.position.set(...pos); root.rotation.y = rotY; root.scale.setScalar(scale); scene.add(root);
  const body = new THREE.Group(); root.add(body);
  const part = (geo, col, x, y, z, sx, sy, sz, p = body) => {
    const m = new THREE.Mesh(geo, catMat(col)); m.position.set(x, y, z); m.scale.set(sx, sy, sz);
    m.castShadow = m.receiveShadow = true; p.add(m); return m;
  };
  const legs = [];
  let head = [0, .34, .04], tailBase = [0, .03, -.12], tailTilt = -Math.PI / 2, curl = .35;
  if (pose === 'sit') {
    part(SPH, c.base, 0, .16, -.01, .12, .155, .13).rotation.x = -.15;
    if (c.back) part(SPH, c.back, 0, .2, -.045, .112, .125, .105);
    if (c.patch) part(SPH, c.patch, .06, .23, -.06, .06, .06, .06);
    if (c.chest) part(SPH, c.chest, 0, .17, .075, .07, .1, .06);
    for (const s of [-1, 1]) {
      part(SPH, c.base, s * .075, .075, -.04, .075, .075, .1);
      part(LEG, c.paws || c.base, s * .04, .18, .085, 1, .95, 1);
      part(SPH, c.paws || c.base, s * .04, .014, .1, .028, .02, .036);
    }
  } else if (pose === 'loaf') {
    part(SPH, c.base, 0, .1, 0, .13, .1, .19);
    if (c.back) part(SPH, c.back, 0, .125, -.02, .122, .085, .16);
    if (c.patch) part(SPH, c.patch, -.06, .15, -.06, .06, .05, .07);
    head = [0, .19, .17]; tailBase = [.05, .05, -.18]; curl = .42;
  } else if (pose === 'sleep') {
    part(SPH, c.base, 0, .085, 0, .17, .085, .15);
    if (c.back) part(SPH, c.back, 0, .105, -.015, .15, .07, .13);
    if (c.patch) part(SPH, c.patch, .07, .12, -.04, .06, .04, .06);
    head = [.1, .08, .11]; tailBase = [-.13, .04, -.04]; curl = .55;
  } else if (pose === 'walk') {
    part(SPH, c.base, 0, .24, 0, .105, .1, .19);
    if (c.back) part(SPH, c.back, 0, .27, -.01, .1, .085, .16);
    if (c.patch) part(SPH, c.patch, .05, .29, -.05, .05, .05, .06);
    if (c.chest) part(SPH, c.chest, 0, .22, .12, .07, .07, .06);
    for (const [x, z] of [[-.05, .12], [.05, .12], [-.05, -.11], [.05, -.11]]) {
      const lg = new THREE.Group(); lg.position.set(x, .21, z); body.add(lg);
      part(LEG, c.paws || c.base, 0, 0, 0, 1, 1.05, 1, lg);
      part(SPH, c.paws || c.base, 0, -.2, .01, .026, .018, .034, lg);
      legs.push(lg);
    }
    head = [0, .35, .2]; tailBase = [0, .27, -.17]; tailTilt = -.45; curl = .08;
  }
  // head
  const hg = new THREE.Group(); hg.position.set(...head); body.add(hg);
  if (pose === 'sleep') hg.rotation.set(.15, .5, .6);
  part(SPH, c.head, 0, 0, 0, .095, .085, .085, hg);
  if (c.headPatch) part(SPH, c.headPatch, 0, .03, -.006, .092, .06, .08, hg);
  part(SPH, c.muzzle, 0, -.026, .058, .046, .032, .032, hg);
  part(SPH, '#d98c8c', 0, -.01, .088, .011, .009, .009, hg);
  const ears = [];
  for (const s of [-1, 1]) {
    const e = part(EAR, c.ears, s * .05, .072, -.005, .032, .058, .022, hg);
    e.rotation.set(0, Math.PI / 4, -s * .32); ears.push(e);
    if (pose === 'sleep') part(CUBE, '#3a2a22', s * .036, .004, .079, .03, .005, .006, hg);
    else if (c.lineEyes) part(CUBE, c.eye, s * .036, .01, .078, .012, .04, .008, hg);
    else { part(SPH, c.eye, s * .037, .012, .068, .017, .017, .012, hg); part(SPH, '#111111', s * .037, .012, .08, .006, .013, .004, hg); }
  }
  // tail: a chain of joints so it can swish
  const tailRoot = new THREE.Group(); tailRoot.position.set(...tailBase); tailRoot.rotation.x = tailTilt; body.add(tailRoot);
  const tail = []; let parent = tailRoot;
  for (let i = 0; i < 6; i++) {
    const j = new THREE.Group(); if (i) j.position.y = .055; parent.add(j);
    part(TAILSEG, c.tail, 0, 0, 0, 1 - i * .06, 1, 1 - i * .06, j);
    tail.push(j); parent = j;
  }
  const cat = { root, body, head: hg, ears, tail, legs, pose, watch, path, scale, curl, baseY: pos[1], phase: Math.random() * 10, hopAt: -9 };
  root.traverse(o => { o.userData.cat = cat; });
  return cat;
}

const camLocal = new THREE.Vector3();
function animateCats(t, dt) {
  for (const cat of cats) {
    const t2 = t + cat.phase, sleeping = cat.pose === 'sleep';
    // walking cats follow an ellipse and swing their legs
    if (cat.path) {
      const p = cat.path; p.u += p.speed * dt / ((p.rx + p.rz) / 2);
      const x = p.cx + p.rx * Math.cos(p.u), z = p.cz + p.rz * Math.sin(p.u);
      cat.root.position.set(x, cat.root.position.y, z);
      cat.root.rotation.y = Math.atan2(-p.rx * Math.sin(p.u), p.rz * Math.cos(p.u));
      cat.legs.forEach((lg, i) => { lg.rotation.x = Math.sin(t * 9 + ((i === 0 || i === 3) ? 0 : Math.PI)) * .5; });
      cat.body.position.y = Math.abs(Math.sin(t * 9)) * .008;
    }
    cat.tail.forEach((j, i) => {
      const amp = sleeping ? .04 : cat.path ? .22 : .16;
      j.rotation.z = cat.curl + Math.sin(t2 * (sleeping ? .8 : 2.2) - i * .7) * amp;
      if (cat.path) j.rotation.x = -.12;
    });
    cat.body.scale.y = 1 + Math.sin(t2 * (sleeping ? 1.6 : 2.4)) * (sleeping ? .045 : .012);
    if (!sleeping) {
      let yaw = Math.sin(t2 * .35) * .45;
      if (cat.watch) {
        camLocal.copy(camera.position).sub(cat.root.position);
        let a = Math.atan2(camLocal.x, camLocal.z) - cat.root.rotation.y;
        a = Math.atan2(Math.sin(a), Math.cos(a));
        yaw = clamp(a, -1.0, 1.0) + Math.sin(t2 * .5) * .1;
      }
      cat.head.rotation.y += (yaw - cat.head.rotation.y) * Math.min(1, dt * 3);
      cat.head.rotation.z = Math.sin(t2 * .23) * .12;
      const twitch = Math.sin(t2 * 3.1) > .985 ? .35 : 0;
      cat.ears.forEach(e => { e.rotation.x = twitch; });
    }
    const h = t - cat.hopAt;
    cat.root.position.y = cat.baseY + (h < .45 ? Math.sin(h / .45 * Math.PI) * .12 : 0);
  }
  yarn.position.x = -1.4 + Math.sin(t * 1.1) * .22;
  yarn.rotation.z = -(yarn.position.x + 1.4) / .07;
  toy.rotation.z = Math.sin(t * 1.7) * .25;
}

    if (!ctx || !on) return;
    const at = ctx.currentTime;
    [[1318.5, 0], [987.8, .16], [1318.5, .32]].forEach(([f, dt]) => [1, 2.76, 5.4].forEach((m, k) => {
      const o = ctx.createOscillator(); o.frequency.value = f * m;
      const g = ctx.createGain(); env(g, at + dt, .05 / (k + 1), 1.4 - k * .3);
      o.connect(g).connect(master); o.start(at + dt); o.stop(at + dt + 1.6);
    }));
  }
  const apply = () => { if (master) master.gain.setTargetAtTime(level(), ctx.currentTime, .15); };
  btn.addEventListener('click', () => { on = !on; paint(); store.set('kk-amb', on ? 'on' : 'off'); start(); apply(); });
  volEl.addEventListener('input', () => { store.set('kk-amb-vol', volEl.value); apply(); });
  const tmp = new THREE.Vector3();
  function update(dt) {
    if (!ctx || !on || held) return;
    t += dt;
    if (t > nextCar) { car(); nextCar = t + 5 + Math.random() * 9; }
    if (t > nextChirp) { chirp(); nextChirp = t + 6 + Math.random() * 10; }
    if (t > nextClink) { clink(.02 + Math.random() * .025); nextClink = t + 4 + Math.random() * 7; }
    if (t > nextSteam) { steam(); nextSteam = t + 22 + Math.random() * 20; }
    if (t > nextMeow) { meow(false, .06 + Math.random() * .05); nextMeow = t + 14 + Math.random() * 18; }
    let near = 0; // the purr grows as you get close to a sleeping cat
    for (const c of cats) {
      if (c.pose !== 'sleep') continue;
      c.root.getWorldPosition(tmp);
      near = Math.max(near, clamp(1 - (tmp.distanceTo(camera.position) - 1) / 5, 0, 1));
    }
    purrGain.gain.setTargetAtTime(.16 * near * near, ctx.currentTime, .3);
  }
  return { start, meow, chime, update, hold(v) { held = v; apply(); } };
})();

/* ================= Gate ================= */
const enterBtn = $('.enter');
let loadingDone = false;
function finishLoading() {
  if (loadingDone) return; loadingDone = true;
  const id = setInterval(() => {
    setProgress(Math.min(progress + 6, 100));
    if (progress >= 100) { clearInterval(id); setTimeout(() => { $('.loader').hidden = true; enterBtn.hidden = false; enterBtn.focus(); }, 250); }
  }, 30);
}
enterBtn.addEventListener('click', () => { entered = true; document.body.classList.add('entered'); teaserVid.play().catch(() => {}); Sound.start(); Sound.chime(); Radio.autoplay(); });
teaserVid.play().catch(() => {}); // muted autoplay usually works right away

/* ================= Loop ================= */
function resize() {
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();
if ('ResizeObserver' in window) new ResizeObserver(resize).observe(canvas);

const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  if (!focused) {
    if (entered) { Object.assign(target, { yaw: userYaw, pitch: userPitch, fov: userFov }); target.pos.copy(HOME.pos); }
    else { target.yaw = .2 + Math.sin(t * .25) * .35; target.pitch = -.08; }
  }
  const k = 1 - Math.exp(-dt * (focused ? 3 : entered ? 4.5 : 2));
  state.yaw += (target.yaw - state.yaw) * k;
  state.pitch += (target.pitch - state.pitch) * k;
  state.fov += (target.fov - state.fov) * k;
  state.pos.lerp(target.pos, k * .8);
  camera.position.copy(state.pos);
  camera.rotation.set(state.pitch, state.yaw, 0);
  if (Math.abs(camera.fov - state.fov) > .01) { camera.fov = state.fov; camera.updateProjectionMatrix(); }

  swing.rotation.x = Math.sin(t * 1.3) * .13;
  neon.material.opacity = .92 + Math.sin(t * 9) * .03 + (Math.random() < .008 ? -.35 : 0);
  animateCats(t, dt);
  animateChars(t);
  updateBubbles(t);
  updateHotspots();
  Sound.update(dt);
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
manager.onLoad = finishLoading;
manager.onError = url => console.warn('Could not load', url);
setTimeout(finishLoading, 6000); // never leave the gate stuck if an image fails
</script>
